<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glitch Animation Example</title>
  <link href="output.css" rel="stylesheet" />
  <style>
    /* Base styling for the H1 */
    .glitch {
      position: relative;
      font-size: 5rem;
      color: white;
      /* Adding a grainy aesthetic via a subtle noise background (optional) */
      /* You can overlay a grainy texture on the body or the element if desired */
    }
    /* Using a data attribute to replicate the text on layers */
    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: white;
      overflow: hidden;
      clip: rect(0, 900px, 0, 0);
    }
    /* First pseudo-element with one color and animation */
    .glitch::before {
      color: #f0f; /* Magenta tint */
      animation: glitch-top 2s infinite linear alternate-reverse;
    }
    /* Second pseudo-element with a different color and animation */
    .glitch::after {
      color: #0ff; /* Cyan tint */
      animation: glitch-bottom 2s infinite linear alternate-reverse;
    }
    /* Keyframe animation for the top layer */
    @keyframes glitch-top {
      0% {
        clip: rect(5%, auto, 15%, 0);
        transform: translate(2px, -2px);
      }
      20% {
        clip: rect(10%, auto, 25%, 0);
        transform: translate(-2px, 2px);
      }
      40% {
        clip: rect(15%, auto, 20%, 0);
        transform: translate(2px, 0);
      }
      60% {
        clip: rect(10%, auto, 30%, 0);
        transform: translate(-1px, -1px);
      }
      80% {
        clip: rect(5%, auto, 15%, 0);
        transform: translate(1px, 2px);
      }
      100% {
        clip: rect(8%, auto, 20%, 0);
        transform: translate(0);
      }
    }
    /* Keyframe animation for the bottom layer */
    @keyframes glitch-bottom {
      0% {
        clip: rect(60%, auto, 70%, 0);
        transform: translate(-2px, 2px);
      }
      20% {
        clip: rect(65%, auto, 75%, 0);
        transform: translate(2px, -2px);
      }
      40% {
        clip: rect(70%, auto, 80%, 0);
        transform: translate(-2px, 1px);
      }
      60% {
        clip: rect(60%, auto, 70%, 0);
        transform: translate(2px, -2px);
      }
      80% {
        clip: rect(65%, auto, 75%, 0);
        transform: translate(-1px, 2px);
      }
      100% {
        clip: rect(60%, auto, 70%, 0);
        transform: translate(0);
      }
    }
  </style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen">
  <!-- Use data-text attribute to show the same text in pseudo-elements -->
  <h1 class="glitch" data-text="Glitchy H1">Glitchy H1</h1>
</body>
</html>
